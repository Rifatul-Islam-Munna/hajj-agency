name: Apply generated patch

on:
  push:
    branches:
      - development
    paths:
      - '.patches/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-generated-patches.mjs
      - name: Synchronize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: apply generated application update"
            git push origin development
          fi